<!DOCTYPE html>
<!-- TELA 1: LOGIN (endereço: /criptografia.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .caixa { background: #fff; padding: 32px; border-radius: 8px; width: 320px;
                 box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box;
                border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #2563eb; color: #fff;
                 border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        #mensagem { text-align: center; margin-top: 12px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="caixa">
        <h2>Login</h2>

        <form id="formLogin">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault(); // impede a página de recarregar

            // Envia email e senha NORMAIS: quem compara com o hash é o Java
            const dados = new URLSearchParams({
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            });

            const resposta = await fetch("/login", { method: "POST", body: dados });
            const texto = await resposta.text();
            const msg = document.getElementById("mensagem");

            if (resposta.ok) {
                // LOGIN CERTO: abre a tela 2
                window.location.href = "/home.html";
            } else {
                // LOGIN ERRADO: mostra a mensagem em vermelho
                msg.textContent = texto;
                msg.style.color = "red";
            }
        });
    </script>
</body>
</html>
